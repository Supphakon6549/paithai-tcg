    <path d="M84,15 C88,24 92,24 96,15 C92,17 88,17 84,15 Z"/>
    <!-- ชุดที่ 5 -->
    <path d="M96,13 C100,4 104,4 108,13 C104,11 100,11 96,13 Z"/>
    <path d="M108,13 C112,4 116,4 120,13 C116,11 112,11 108,13 Z"/>
