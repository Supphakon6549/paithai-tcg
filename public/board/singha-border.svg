<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 28" width="120" height="28" preserveAspectRatio="none">
  <defs>
    <linearGradient id="goldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="35%" stop-color="#d9b24c"/>
      <stop offset="75%" stop-color="#8c6418"/>
      <stop offset="100%" stop-color="#3d2706"/>
    </linearGradient>
    <linearGradient id="lacquerGroove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b0c09"/>
      <stop offset="50%" stop-color="#120605"/>
      <stop offset="100%" stop-color="#38120d"/>
    </linearGradient>
  </defs>

  <!-- พื้นร่องรักดำ-ชาด -->
  <rect width="120" height="28" fill="url(#lacquerGroove)"/>

  <!-- เส้นลวดบัวบน-ล่าง -->
  <rect x="0" y="0" width="120" height="3" fill="url(#goldRim)"/>
  <rect x="0" y="25" width="120" height="3" fill="url(#goldRim)"/>
  <line x1="0" y1="14" x2="120" y2="14" stroke="#fae094" stroke-opacity="0.55" stroke-width="1"/>

