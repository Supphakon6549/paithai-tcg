<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 176">
  <defs>
    <radialGradient id="pitDepth" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14100c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050403" stop-opacity="0.88"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae094"/>
      <stop offset="50%" stop-color="#d9b24c"/>
      <stop offset="100%" stop-color="#8c6418"/>
    </linearGradient>
  </defs>

  <!-- ผนังหลุมศิลาฝังพื้น 4 ด้าน (ให้มิติบุ๋มลงในโต๊ะ) -->
  <polygon points="0,0 126,0 116,10 10,10" fill="#040302" fill-opacity="0.82"/>
  <polygon points="0,0 10,10 10,166 0,176" fill="#090705" fill-opacity="0.72"/>
  <polygon points="126,0 126,176 116,166 116,10" fill="#1f1710" fill-opacity="0.55"/>
  <polygon points="10,166 116,166 126,176 0,176" fill="#d9b24c" fill-opacity="0.22"/>

  <!-- พื้นหลุมศิลาด้านใน -->
  <rect x="9" y="9" width="108" height="158" rx="4" fill="url(#pitDepth)" stroke="url(#goldStroke)" stroke-width="1.3" stroke-opacity="0.62"/>

  <!-- เส้นบอกแนววางการ์ดท่าตั้งรับแนวนอน (ฝังในแท่นหิน) -->
  <rect x="13" y="49" width="100" height="78" rx="3" fill="none" stroke="#d9b24c" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- กรอบแท่นศิลาแปดเหลี่ยมด้านใน -->
  <polygon points="24,16 102,16 111,25 111,151 102,160 24,160 15,151 15,25" fill="none" stroke="url(#goldStroke)" stroke-opacity="0.45" stroke-width="1.1"/>

  <!-- ฐานบัวแปดกลีบและยันต์มหาพิชัยสงครามตรงกลาง -->
  <g transform="translate(63,88)" fill="none" stroke="url(#goldStroke)">
    <!-- วงแหวนรอบฐานบัว -->
    <circle cx="0" cy="0" r="41" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="0" cy="0" r="36" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- กลีบบัว 8 ทิศ -->
    <g stroke-opacity="0.58" stroke-width="1.2" fill="#d9b24c" fill-opacity="0.07">
      <path d="M0,-39 C7,-27 7,-18 0,-12 C-7,-18 -7,-27 0,-39 Z"/>
      <path d="M0,39 C7,27 7,18 0,12 C-7,18 -7,27 0,39 Z"/>
      <path d="M-39,0 C-27,7 -18,7 -12,0 C-18,-7 -27,-7 -39,0 Z"/>
      <path d="M39,0 C27,7 18,7 12,0 C18,-7 27,-7 39,0 Z"/>
      <path d="M-27,-27 C-15,-22 -11,-15 -9,-9 C-15,-11 -22,-15 -27,-27 Z"/>
      <path d="M27,-27 C15,-22 11,-15 9,-9 C15,-11 22,-15 27,-27 Z"/>
      <path d="M-27,27 C-15,22 -11,15 -9,9 C-15,11 -22,15 -27,27 Z"/>
      <path d="M27,27 C15,22 11,15 9,9 C15,11 22,15 27,27 Z"/>
    </g>

    <!-- ยันต์แปดทิศซ้อนในฐานบัว -->
    <rect x="-19" y="-19" width="38" height="38" stroke-opacity="0.52" stroke-width="1.2"/>
    <rect x="-19" y="-19" width="38" height="38" transform="rotate(45)" stroke-opacity="0.52" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="12" fill="#0d0a07" fill-opacity="0.7" stroke-opacity="0.65" stroke-width="1.4"/>
    <!-- ดอกประจำยามใจกลางยันต์ -->
    <polygon points="0,-9 3,-3 9,0 3,3 0,9 -3,3 -9,0 -3,-3" fill="#fae094" fill-opacity="0.38" stroke="none"/>
    <circle cx="0" cy="0" r="2.5" fill="#fae094" fill-opacity="0.7"/>
  </g>

  <!-- ลายกนกมุมหลุมทั้ง 4 มุม -->
  <g fill="none" stroke="#fae094" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round">
    <path d="M13,28 L13,13 L28,13"/>
    <path d="M98,13 L113,13 L113,28"/>
    <path d="M13,148 L13,163 L28,163"/>
    <path d="M98,163 L113,163 L113,148"/>
  </g>
</svg>
