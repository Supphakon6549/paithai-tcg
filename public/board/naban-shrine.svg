<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 126 176">
  <defs>
    <radialGradient id="shrineDepth" cx="50%" cy="55%" r="62%">
      <stop offset="0%" stop-color="#1d140d" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#070504" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="nabanGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="50%" stop-color="#d9b24c"/>
      <stop offset="100%" stop-color="#8c6319"/>
    </linearGradient>
  </defs>

  <!-- ผนังหลุมศิลาฝังพื้น 4 ด้าน -->
  <polygon points="0,0 126,0 116,10 10,10" fill="#040302" fill-opacity="0.86"/>
  <polygon points="0,0 10,10 10,166 0,176" fill="#090705" fill-opacity="0.76"/>
  <polygon points="126,0 126,176 116,166 116,10" fill="#211810" fill-opacity="0.56"/>
  <polygon points="10,166 116,166 126,176 0,176" fill="#fae094" fill-opacity="0.25"/>

  <!-- พื้นหลุมด้านใน -->
  <rect x="9" y="9" width="108" height="158" rx="4" fill="url(#shrineDepth)" stroke="url(#nabanGold)" stroke-width="1.4" stroke-opacity="0.68"/>

  <!-- ซุ้มหน้าบันปราสาทไทย (ช่อฟ้า ใบระกา หางหงส์ เสาหาร และฐานสิงห์) -->
  <g fill="none" stroke="url(#nabanGold)">
    <!-- ยอดช่อฟ้าและโครงหน้าบันสามเหลี่ยมหยัก -->
    <path
      d="M63,14
         L67,24 L84,42 L106,56 L100,62 L88,58
         L88,136 L100,136 L104,146 L22,146 L26,136 L38,136
         L38,58 L26,62 L20,56 L42,42 L59,24 Z"
      fill="#d9b24c"
      fill-opacity="0.07"
      stroke-opacity="0.78"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
    <!-- กรอบหน้าบันชั้นใน -->
    <polygon points="63,28 88,54 38,54" fill="#fae094" fill-opacity="0.12" stroke-opacity="0.68" stroke-width="1.2"/>
    <!-- ดอกประจำยามกลางหน้าบัน -->
    <circle cx="63" cy="44" r="4.5" fill="#fae094" fill-opacity="0.55" stroke="none"/>

    <!-- เสาหารคู่ซ้าย-ขวา -->
    <line x1="43" y1="54" x2="43" y2="136" stroke-opacity="0.45" stroke-width="1.1"/>
    <line x1="83" y1="54" x2="83" y2="136" stroke-opacity="0.45" stroke-width="1.1"/>

    <!-- ฐานสิงห์รองซุ้มหน้าบัน -->
    <path d="M18,151 L108,151 M24,156 L102,156" stroke-opacity="0.62" stroke-width="1.5"/>
  </g>
</svg>
