<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="stoneShade" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.26"/>
    </radialGradient>
  </defs>

  <!-- พื้นแผ่นศิลาจำหลักและร่องหิน -->
  <rect width="160" height="160" fill="url(#stoneShade)"/>
  <rect x="1.5" y="1.5" width="157" height="157" fill="none" stroke="#d9b24c" stroke-opacity="0.16" stroke-width="1"/>
  <path d="M0,0 L160,0 M0,160 L160,160 M0,0 L0,160 M160,0 L160,160" stroke="#050403" stroke-opacity="0.65" stroke-width="2.5"/>

  <!-- เส้นทแยงตารางศิลาอ่อน ๆ -->
  <path d="M80,6 L154,80 L80,154 L6,80 Z" fill="none" stroke="#d9b24c" stroke-opacity="0.11" stroke-width="1"/>

  <!-- ลายประจำยามกลางแผ่นศิลา -->
  <g transform="translate(80,80)" fill="none" stroke="#e5c158" stroke-opacity="0.22" stroke-width="1.2">
    <!-- กลีบประจำยาม 4 ทิศ -->
    <path d="M0,-26 C7,-14 7,-7 0,0 C-7,-7 -7,-14 0,-26 Z" fill="#d9b24c" fill-opacity="0.05"/>
    <path d="M26,0 C14,7 7,7 0,0 C7,-7 14,-7 26,0 Z" fill="#d9b24c" fill-opacity="0.05"/>
    <path d="M0,26 C7,14 7,7 0,0 C-7,7 -7,14 0,26 Z" fill="#d9b24c" fill-opacity="0.05"/>
    <path d="M-26,0 C-14,7 -7,7 0,0 C-7,-7 -14,-7 -26,0 Z" fill="#d9b24c" fill-opacity="0.05"/>
    <!-- กลีบแซมทแยง 4 มุม -->
    <path d="M-15,-15 L-5,-8 L-8,-5 Z M15,-15 L5,-8 L8,-5 Z M15,15 L5,8 L8,5 Z M-15,15 L-5,8 L-8,5 Z"/>
    <circle cx="0" cy="0" r="5" fill="#d9b24c" fill-opacity="0.12"/>
    <circle cx="0" cy="0" r="2"/>
  </g>

  <!-- ลายกนกมุมแผ่นศิลา 4 มุม -->
  <g fill="none" stroke="#d9b24c" stroke-opacity="0.2" stroke-width="1.1">
    <path d="M6,22 C6,11 11,6 22,6 C15,11 13,15 13,20 M6,6 L15,15"/>
    <path d="M154,22 C154,11 149,6 138,6 C145,11 147,15 147,20 M154,6 L145,15"/>
    <path d="M6,138 C6,149 11,154 22,154 C15,149 13,145 13,140 M6,154 L15,145"/>
    <path d="M154,138 C154,149 149,154 138,154 C145,149 147,145 147,140 M154,154 L145,145"/>
  </g>
</svg>
